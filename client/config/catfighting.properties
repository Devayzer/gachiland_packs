# Cat Fighting configuration
# Ticks are 1/20 of a second. Restart the game to apply changes.

# How close a cat has to get to another cat to start arguing (blocks).
detect_radius=6.0

# How far apart two arguing/fighting cats can drift before giving up (blocks).
lose_radius=10.0

# Movement speed multiplier while a cat approaches its target.
approach_speed=1.25

# Standoff (arguing) duration range, in ticks - a random value in this
# range is picked per encounter.
standoff_min_ticks=200
standoff_max_ticks=400

# Maximum duration of the fight phase, in ticks.
max_fight_ticks=160

# How long a cat waits after a fight before it can start another one, in ticks.
cooldown_ticks=400

# How long a shovel-flattened cat stays squashed, in seconds.
squash_seconds=4.0
